services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  ingestion:
    build:
      context: ./backend/ingestion-service
    environment:
      DATABASE_PATH: /data/ingestion.db
      HOST: 0.0.0.0
      PORT: 8001
      RATE_LIMIT_PER_MINUTE: 1000
      REDIS_URL: redis://redis:6379/0
      INFERENCE_LOG_STREAM: ${INFERENCE_LOG_STREAM:-inference.logs}
      INFERENCE_CONSUMER_GROUP: ingestion-service
      INFERENCE_CONSUMER_NAME: ingestion-1
    depends_on:
      - redis
    ports:
      - "8001:8001"
    volumes:
      - ingestion-data:/data

  chatbot:
    build:
      context: ./backend/chatbot-service
    environment:
      DATABASE_PATH: /data/chatbot.db
      HOST: 0.0.0.0
      PORT: 8000
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_FALLBACK_PROVIDERS: ${LLM_FALLBACK_PROVIDERS:-mock}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      INGESTION_API_URL: http://ingestion:8001/api/ingest
      REDIS_URL: redis://redis:6379/0
      INFERENCE_LOG_STREAM: ${INFERENCE_LOG_STREAM:-inference.logs}
      ALLOWED_ORIGINS: http://localhost:5173
      CSRF_COOKIE_SECURE: "false"
    depends_on:
      - redis
      - ingestion
    ports:
      - "8000:8000"
    volumes:
      - chatbot-data:/data

  frontend:
    build:
      context: ./frontend
    environment:
      CHATBOT_API_URL: http://chatbot:8000
      INGESTION_API_URL: http://ingestion:8001
    depends_on:
      - chatbot
      - ingestion
    ports:
      - "5173:5173"

volumes:
  chatbot-data:
  ingestion-data:
  redis-data:
